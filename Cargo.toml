[package]
name = "injet"
version = "1.1.0"
edition = "2021"
description = "Inject and extract files into PNG images using LSB (Least Significant Bit) method"
license = "MIT"
repository = "https://github.com/deliro/injet"
readme = "README.md"
categories = ["command-line-utilities", "multimedia::images", "security"]
keywords = ["binary", "bin", "steganography", "lsb"]
exclude = ["/.github", "/target"]

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
itertools = "0.14"
rand = "0.9"
thiserror = "2"
crc32fast = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "alloc", "std", "encryption"] }
argon2 = { version = "0.5", default-features = false, features = ["std", "alloc"] }
rpassword = "7"
zeroize = { version = "1", features = ["zeroize_derive"] }
getrandom = "0.2"

# mimalloc upstream supports glibc Linux, macOS, Windows, and FreeBSD on the
# tier-1 architectures we ship for. Excluded on musl and unknown targets where
# the C bindings either fail to build or regress vs. the system allocator.
[target.'cfg(any(all(target_os = "linux", not(target_env = "musl")), target_os = "macos", target_os = "windows", target_os = "freebsd"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
rstest = "0.18"
predicates = "3"
insta = "1"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
float_cmp = "deny"
lossy_float_literal = "deny"
as_conversions = "deny"
default_numeric_fallback = "deny"
mod_module_files = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
similar_names = "allow"
